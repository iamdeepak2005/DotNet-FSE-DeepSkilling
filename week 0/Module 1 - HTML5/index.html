<!DOCTYPE html>
<html lang="en">
<!--
   Cognizant .NET FSE Training
   Module 1 - HTML5 Lab Assignment
   Author: Deepa Nair
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Event Portal - HTML5 Assignment</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #0f172a;
            --card-color: #1e293b;
            --text-color: #f8fafc;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }
        nav {
            background-color: var(--card-color);
            padding: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            color: #ffffff;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        section {
            background-color: var(--card-color);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }
        .highlight {
            color: #ec4899;
            font-weight: bold;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        .gallery-card {
            border: 1px solid #334155;
            border-radius: 6px;
            overflow: hidden;
            background: #0f172a;
            text-align: center;
            padding-bottom: 10px;
        }
        .gallery-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#home">Home</a>
        <a href="#gallery">Gallery</a>
        <a href="#register">Register</a>
        <a href="#video">Teaser</a>
        <a href="#prefs">Settings</a>
        <a href="#location">Find Us</a>
    </nav>

    <div class="container">
        <!-- welcome banner -->
        <section id="home">
            <div id="welcomeBanner" style="border-left: 4px solid #10b981; padding-left: 10px;">
                <h2>Welcome Back!</h2>
                <p>Check out our featured <span class="highlight">Summer Music Festival</span> happening next month.</p>
            </div>
        </section>

        <!-- images list -->
        <section id="gallery">
            <h3>Event Gallery</h3>
            <div class="gallery">
                <div class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=400&q=80" alt="Concert" title="Live Concert">
                    <h4>Music Show</h4>
                </div>
                <div class="gallery-card">
                    <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=400&q=80" alt="Food" title="Food Stalls">
                    <h4>Food Carnival</h4>
                </div>
            </div>
        </section>

        <!-- registration form -->
        <section id="register">
            <h3>Event Registration</h3>
            <form id="regForm" onsubmit="registerUser(event)">
                <div style="margin-bottom: 10px;">
                    <label>Full Name:</label><br>
                    <input type="text" id="username" required autofocus style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label>Email:</label><br>
                    <input type="email" id="email" required style="width: 100%; padding: 8px;">
                </div>
                <div style="margin-bottom: 10px;">
                    <label>Event Type:</label><br>
                    <select id="eventSelect" style="width: 100%; padding: 8px;">
                        <option value="music">Music Show</option>
                        <option value="food">Food Carnival</option>
                    </select>
                </div>
                <button type="submit">Submit</button>
                <div style="margin-top: 10px;">
                    <output id="confirmMsg" class="highlight"></output>
                </div>
            </form>
        </section>

        <!-- video section -->
        <section id="video">
            <h3>Video Teaser</h3>
            <video id="promoVid" controls style="width: 100%; max-width: 450px;">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-group-of-friends-cheering-at-a-music-concert-40280-large.mp4" type="video/mp4">
            </video>
            <p id="vidStatus" class="highlight">Video status: ready to play</p>
        </section>

        <!-- preferences section -->
        <section id="prefs">
            <h3>Save Favorite category</h3>
            <select id="favCategory" style="padding: 8px;">
                <option value="music">Music Show</option>
                <option value="food">Food Carnival</option>
            </select>
            <button onclick="saveCategory()">Save</button>
            <button onclick="clearCategory()" style="background-color: #ef4444;">Clear</button>
            <p id="prefStatus" style="color: #10b981; margin-top: 10px;"></p>
        </section>

        <!-- geo location -->
        <section id="location">
            <h3>Find Closest Event</h3>
            <button onclick="getUserLocation()">Get Coordinates</button>
            <p id="geoOut" style="margin-top: 10px; font-family: monospace;"></p>
        </section>
    </div>

    <script>
        // basic form handler
        function registerUser(e) {
            e.preventDefault();
            const name = document.getElementById("username").value;
            const eventVal = document.getElementById("eventSelect").value;
            document.getElementById("confirmMsg").textContent = "Thanks " + name + "! Registered for " + eventVal + ".";
            console.log("Registration submitted for: " + name);
        }

        // video events
        const vid = document.getElementById("promoVid");
        const statusText = document.getElementById("vidStatus");
        vid.addEventListener("play", () => { statusText.textContent = "Video playing..."; });
        vid.addEventListener("pause", () => { statusText.textContent = "Video paused."; });

        // save to local storage
        function saveCategory() {
            const cat = document.getElementById("favCategory").value;
            localStorage.setItem("myFavCat", cat);
            document.getElementById("prefStatus").textContent = "Saved category: " + cat;
        }
        function clearCategory() {
            localStorage.removeItem("myFavCat");
            document.getElementById("prefStatus").textContent = "Preferences cleared.";
        }
        window.onload = () => {
            const cat = localStorage.getItem("myFavCat");
            if (cat) {
                document.getElementById("favCategory").value = cat;
                document.getElementById("prefStatus").textContent = "Loaded favorite category: " + cat;
            }
        };

        // geolocation
        function getUserLocation() {
            const out = document.getElementById("geoOut");
            out.textContent = "Fetching coordinates...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    out.innerHTML = "Lat: " + pos.coords.latitude.toFixed(4) + "<br>Long: " + pos.coords.longitude.toFixed(4);
                }, () => {
                    out.textContent = "Unable to fetch location.";
                });
            } else {
                out.textContent = "Geolocation not supported.";
            }
        }
    </script>
</body>
</html>
