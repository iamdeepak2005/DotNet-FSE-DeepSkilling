<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 layout</title>
    <!-- bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f8fafc;
        }
    </style>
</head>
<body>

    <!-- navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">Portal Layout</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#grid">Grid</a>
                <a class="nav-link" href="#cards">Cards</a>
            </div>
        </div>
    </nav>

    <!-- grid -->
    <div id="grid" class="container mb-5">
        <h2 class="h4 text-info mb-3">Grid Layout (Responsive columns)</h2>
        <div class="row g-3">
            <div class="col-12 col-md-4">
                <div class="p-3 bg-secondary bg-opacity-25 rounded text-center">
                    <h5>Main Topic</h5>
                    <p class="small text-muted">col-12 col-md-4</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="p-3 bg-secondary bg-opacity-25 rounded text-center">
                    <h5>Resources</h5>
                    <p class="small text-muted">col-12 col-md-4</p>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="p-3 bg-secondary bg-opacity-25 rounded text-center">
                    <h5>Schedule</h5>
                    <p class="small text-muted">col-12 col-md-4</p>
                </div>
            </div>
        </div>
    </div>

    <!-- cards container -->
    <div id="cards" class="container mb-5">
        <h2 class="h4 text-info mb-3">Card Components</h2>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Music">
                    <div class="card-body">
                        <h5 class="card-title text-info">Music Show</h5>
                        <p class="card-text text-muted">Register for upcoming acoustic performances.</p>
                        <a href="#" class="btn btn-primary w-100">Apply</a>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card p-3 shadow-sm">
                    <img src="https://images.unsplash.com/photo-1498837167922-ddd27525d352?auto=format&fit=crop&w=400&q=80" class="card-img-top" alt="Food">
                    <div class="card-body">
                        <h5 class="card-title text-success">Food Fest</h5>
                        <p class="card-text text-muted">Taste local cuisines and culinary preparations.</p>
                        <a href="#" class="btn btn-success w-100">Apply</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
